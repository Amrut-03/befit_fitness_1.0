name: fitness_app
description: A comprehensive fitness and health tracking application for BeFit app.
publish_to: 'none'

version: 1.0.0+1

# Environment configuration
environment:
  sdk: ^3.11.3

# Default visibility for pub.dev publishing
# Change to 'none' for private apps, or remove to publish to pub.dev

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  equatable: ^2.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.3.0
  go_router: ^17.2.2
  lottie: ^3.3.3
  flutter_body_part_selector: ^1.2.1
  fl_chart: ^1.2.0
  animated_reorderable_list: ^1.3.0
  mobile_scanner: ^5.2.3
  permission_handler: ^12.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^21.0.0
  share_plus: ^13.1.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  vision_gallery_saver: ^3.1.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  firebase_messaging: ^16.2.2
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  intl: ^0.20.2
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  pedometer_2: ^5.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  # Enable Material Design visuals
  uses-material-design: true

  # Assets configuration
  assets:
    - assets/lotties/
    - assets/icons/
    - assets/splash_screen/

  # Custom fonts configuration
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package